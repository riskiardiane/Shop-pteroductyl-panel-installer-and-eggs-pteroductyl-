# AURORA 2.0 Panel — nginx site configuration (HTTP or Let's Encrypt-managed)
server {
    server_name <domain>;

    root /var/www/pterodactyl/public;
    index index.html index.htm index.php;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    access_log off;
    error_log  /var/log/nginx/pterodactyl.app-error.log error;

    # static assets must not fall through to PHP
    location ^~ /assets/ {
        location ~ /\. { deny all; }
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # allow larger file uploads and longer script runtimes
    client_max_body_size 100m;
    client_body_timeout 120s;

    sendfile off;

    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # security headers

    # Block sensitive files and framework internals outright
    location ~* /(\.env|\.git|\.gitignore|composer\.(json|lock)|package\.json|yarn\.lock|artisan|storage/debugbar|phpunit\.xml|\.blueprint|\.prettierrc|\.editorconfig|\.build-cache\.json|yarn-error\.log) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # never serve logs / framework internals; anchored to the web root so the
    # theme's own /themes/pterodactyl/vendor assets keep working.
    location ~* ^/(storage/logs|bootstrap/cache)/ { deny all; }
    location ^~ /vendor/ { deny all; }
    location ^~ /node_modules/ { deny all; }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:<php_socket>;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize = 100M \n post_max_size=100M";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }

    listen 80;
    listen [::]:80;
}
